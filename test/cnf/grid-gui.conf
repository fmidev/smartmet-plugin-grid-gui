// The grid-gui plugin with the grid test data (smartmet-library-grid-files-test)

@include "environment.conf"

smartmet :
{
plugin :
{
grid-gui :
{
  grid-files :
  {
    configFile = "%(DIR)/grid/library/grid-files.conf"
  }

  colorFile = "%(DIR)/../../cfg/colors2.csv"

  colorMapFiles :
  [
    "%(DIR)/../../cfg/colormaps/dali_precipitation.csv",
    "%(DIR)/../../cfg/colormaps/dali_temperature_celcius.csv",
    "%(DIR)/../../cfg/colormaps/dali_temperature_kelvin.csv",
    "%(DIR)/../../cfg/colormaps/values_-33_to_68.csv",
    "%(DIR)/../../cfg/colormaps/values_-42_to_-6_and_6_to_42.csv",
    "%(DIR)/../../cfg/colormaps/values_-42_to_42.csv",
    "%(DIR)/../../cfg/colormaps/values_0_to_1.csv",
    "%(DIR)/../../cfg/colormaps/values_0_to_10.csv",
    "%(DIR)/../../cfg/colormaps/values_0_to_100.csv",
    "%(DIR)/../../cfg/colormaps/values_0_to_32.csv",
    "%(DIR)/../../cfg/colormaps/values_240_to_341.csv",
    "%(DIR)/../../cfg/colormaps/values_90000_to_110000.csv"
  ]

  blockedProjections : [ ]

  animationEnabled = true

  imageCache :
  {
    directory = "%(DIR)/../tmp"
    maxImages = 100
    minImages = 50
  }

  ui :
  {
    url = "/gui"
    directory = "%(DIR)/../../ui"
  }
}
}
}
